  <!-- Form -->
  <h2>Formulir Pendaftaran</h2>

  <form action="#" method="post">

    <label>Nama Lengkap:</label><br>
    <input type="text" name="nama" required><br><br>

    <label>Tempat, Tanggal Lahir:</label><br>
    <input type="text" name="ttl" required><br><br>

    <label>Jenis Kelamin:</label><br>
    <input type="radio" name="jk" value="Laki-laki"> Laki-laki
    <input type="radio" name="jk" value="Perempuan"> Perempuan<br><br>

    <label>Alamat:</label><br>
    <textarea name="alamat" rows="4" cols="30"></textarea><br><br>

    <label>Asal Sekolah:</label><br>
    <input type="text" name="asal_sekolah"><br><br>

    <label>Email:</label><br>
    <input type="email" name="email"><br><br>

    <label>No HP:</label><br>
    <input type="text" name="nohp"><br><br>

    <label>Pilih Jurusan:</label><br>
    <select name="jurusan">
      <option>PPLG</option>
      <option>TKJ</option>
      <option>PMS</option>
      <option>AKL</option>
      <option>TKR</option>
      <option>ATPH</option>
    </select><br><br>

    <button type="submit">Daftar</button>
    <button type="reset">Reset</button>

  </form>

  <hr>
